spring:
  application:
    name: MFV

  datasource:
    url: jdbc:mysql://localhost:3306/shop?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ddl-auto: create : 실행할 때마다 테이블을 지우고 새로 만듭니다 / 데이터 쌓이기 시작하면 update / validate 로 변경
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        default_batch_fetch_size: 100

  data:
    web:
      pageable:
        max-page-size: 50
  #이미지 관련
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  #AI
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: gemini-3.6-flash
file:
  upload-dir: ./images

server:
  servlet:
    session:
      timeout: 18000