<!DOCTYPE html>
<html lang="ko">

<head>
    <title>MFV - 결제</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/templatemo.css">
    <link rel="icon" href="assets/img/favicon.ico">

    <!-- Load fonts style after rendering the layout styles -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;200;300;400;500;700;900&display=swap">
    <link rel="stylesheet" href="assets/css/fontawesome.min.css">

</head>
<body>
<div id="header"></div>

<!--START CONTENT-->
<section class="py-5 bg-light">
    <div class="col-12 col-md-10 mx-auto">
        <h2>결제하기</h2>
        <p>아래 내용을 확인 후 결제를 완료해주세요.</p>
    </div>
    <div class="col-12 col-md-10 mx-auto border border-white p-4 bg-white" style="border-radius: 12px">
        <div class="bg-white rounded p-4 mb-3 shadow-sm border-0">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0">배송지</h5>
                <a class="text-success text-decoration-none small" data-bs-toggle="modal" data-bs-target="#addressModal">변경</a>
            </div>
            <div class="rounded p-3" style="background: #f8f9fa;" id="address-info"></div>
        </div>
        <div class="bg-white rounded p-4 mb-3 p-4 shadow-sm border-0">
            <h5>배송 요청사항</h5>
            <div class="row g-2 mb-4">
                <select id="deliveryRequest" class="form-select border border-dark rounded p-1" onchange="showDirectInput()">
                    <option value="">배송 시 요청사항을 선택해주세요</option>
                    <option value="문 앞에 놓아주세요">문 앞에 놓아주세요</option>
                    <option value="경비실에 맡겨주세요">경비실에 맡겨주세요</option>
                    <option value="직접 받겠습니다">직접 받겠습니다</option>
                    <option value="부재 시 연락주세요">부재 시 연락주세요</option>
                    <option value="direct">직접입력</option>
                </select>
                <textarea id="directInput" class="form-control mt-2 d-none" rows="8" placeholder="요청사항을 입력하세요." style="resize: none"></textarea>
            </div>
        </div>
        <div class="bg-white rounded p-4 mb-3 p-4 shadow-sm border-0">
            <h5>주문 상품 <span class="text-success" id="product-count"></span></h5>
            <div id="order-items"></div>
        </div>
        <div class="bg-white rounded p-4 mb-3 p-4 shadow-sm border-0">
            <div class="d-flex justify-content-between align-items-center">
                <h5 class="mb-0">포인트</h5>
                <p>보유 <span id="point">111</span>P</p>
            </div>
            <div class="row g-2">
                <div class="col-8">
                    <input type="number" class="form-control" placeholder="포인트 입력">
                </div>
                <div class="col-4">
                    <button class="btn btn-outline-success w-100">전액사용</button>
                </div>
            </div>
        </div>
        <div class="bg-white rounded p-4 mb-3 p-4 shadow-sm border-0">
            <h5>최종 결제금액</h5>
        </div>
        <div class="bg-white rounded p-4 mb-3 p-4 shadow-sm border-0">
            <h5>결제수단</h5>
        </div>
        <div class="bg-white rounded p-4 mb-3 p-4 shadow-sm border-0">
            <div>동의 약관</div>
            <button class="btn btn-success w-100">
                <spa>금액</spa>
                결제하기
            </button>
        </div>
    </div>
</section>

<!--addressModal -->
<div class="modal fade" id="addressModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false" aria-labelledby="addressModal" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content p-3">
            <div class="modal-header border-0">
                <h5 class="modal-title fs-5">배송지 변경</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="address-list"></div>
                <hr>
                <div id="address-form">
                    <a class="btn btn-outline-success w-100" href="address-form.html?type=add">배송지 등록</a>
                </div>
            </div>
        </div>
    </div>
</div>

<!--END CONTENT-->
<div id="footer"></div>

<!-- Start Script -->
<script src="assets/js/jquery-1.11.0.min.js"></script>
<script src="assets/js/jquery-migrate-1.2.1.min.js"></script>
<script src="assets/js/templatemo.js"></script>
<script src="js/common.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let seletedAddress = null;
    /*
    * 포인트 연동
    * 최종 결제 금액 계산
    * 결제하기 버튼 - 주문 생성 API 호출*/
    document.addEventListener("DOMContentLoaded", async () => {
        await checkLogin();
        await loadDeliveryAddress()
        loadOrderItems();
        await loadPoint();
        calcTotal();
    })

    document.getElementById('addressModal').addEventListener('show.bs.modal', () => {
        loadAddressList();
    });

    async function checkLogin() {
        const response = await fetch('/api/customers/my', {credentials: "include"});
        if (!response.ok) {
            location.href = 'login.html';
        }
    }

    async function loadDeliveryAddress() {
        const response = await fetchWithAuth(`/api/customers/address`);
        if (!response) return;
        
        const data = await response.json();

        const container = document.getElementById('address-info');
        container.innerHTML = '';

        if (data.length === 0) {
            container.innerHTML = `
              <p class="text-muted">등록된 배송지가 없습니다. 배송지를 등록하세요.</p>
              <a href="address-form.html?type=add" class="btn btn-outline-info" btn-sm>배송지 등록</a>
            `;
        } else {
            let address;

            if (seletedAddress)
                address = seletedAddress;
            else {
                address = data.find(item => item.default) || data[0];
            }

            container.innerHTML = `
                <p class="fw-normal mb-2 fs-6">${address.addressName} (${address.receiver})  ${address.default ? '<span class="badge rounded-pill bg-success ms-1" style="font-size: 12px;">기본배송지</span>' : ''}</p>
                <p class="fw-light mb-2 fs-6">(${address.zipcode}) ${address.roadAddress}</p>
                <p class="fw-light mb-2 fs-6">${address.detailAddress}</p>
                <p style="font-size: 11px">${address.contact}</p>
            `;
        }
    }

    async function loadAddressList() {
        const response = await fetchWithAuth(`/api/customers/address`);
        if (!response) return;

        const data = await response.json();

        const container = document.getElementById('address-list');
        container.innerHTML = '';

        if (data) {
            data.forEach(address => {
                const card = `
                    <div class="d-flex align-items-start py-3 border-top">
                        <input type="radio" name="addressSelect" class="me-3 mt-1" value="${address.deliveryId}" ${address.default ? 'checked' : ''}>
                        <div class="flex-grow-1">
                            <p class="fw-bold mb-1">${address.addressName} (${address.receiver})
                            ${address.default ? '<span class="badge bg-secondary">기본배송지</span>' : ''}
                            </p>
                            <p class="mb-1">(${address.zipcode}) ${address.roadAddress}</p>
                            <p class="mb-1">${address.detailAddress}</p>
                            <p>${address.contact}</p>
                        </div>
                        <div class="d-flex flex-column align-item-end gap-1 text-nowrap">
                            <a class="text-muted small" href="address-form.html?type=update&deliveryId=${address.deliveryId}">수정</a>
                            <a class="text-danger small" onclick="deleteAddress(${address.deliveryId}, ${address.default})">삭제</a>
                        </div>
                    </div>
                `;

                container.innerHTML += card;
            });

            const targetId = seletedAddress ? seletedAddress.deliveryId : data.find(a => a.default)?.deliveryId;
            document.querySelector(`input[value="${targetId}"]`).checked = true;

            document.querySelectorAll('input[name="addressSelect"]').forEach(radio => {
                radio.addEventListener('change', (e) => {
                    seletedAddress = data.find(a => a.deliveryId == e.target.value);
                    loadDeliveryAddress(seletedAddress);

                    document.querySelector('#addressModal .btn-close').click();
                });
            });

        }
    }

    async function deleteAddress(deliveryId, isDefault) {
        if (isDefault) {
            alert('기본배송지는 삭제 할 수 없습니다.');
            return;
        }

        if (!confirm('배송지를 삭제하시겠습니까?')) return;

        const response = await fetch(`/api/customers/address/${deliveryId}`, {
            method: 'DELETE',
            credentials: "include"
        });

        if (response.ok) {
            //선택된 배송지가 삭제된 경우 초기화
            if (seletedAddress?.deliveryId == deliveryId) {
                seletedAddress = null;
            }
            loadDeliveryAddress();
            loadAddressList();

        } else {
            const error = await response.json();
            alert(error.message || '배송지 삭제 실패');
        }
    }

    function loadOrderItems() {
        const orderItems = JSON.parse(sessionStorage.getItem('selectedItems')) || [];

        document.getElementById("product-count").innerText = orderItems.length;

        const container = document.getElementById('order-items');
        container.innerHTML = '';

        if (orderItems) {
            orderItems.forEach(item => {
                const img = item.imageUrl ? `
                    <div style="width:80px; height:80px; background:#f8f9fa; border-radius:8px; padding:5px;">
                        <img src="${item.imageUrl}" class="img-fluid" style="width:100%; height:100%; object-fit:cover;">
                    </div>`
                    : `<div style="width:80px; height:80px; background:#f8f9fa; border-radius:8px;"></div>`;

                const orderProducts = `
                    <div class="row align-items-center py-3 border-bottom">
                       <div class="col-12 col-md-2 d-flex align-items-center">${img}</div>
                            <div class="col-12 col-md-6">
                                <p class="fw-bold mb-0">${item.productName} </p>
                                <p class="text-muted small mb-0">${item.unit}</p>
                            </div>
                            <div class="col-12 col-md-4 text-end">
                                <p class="fw-bold mb-0">${(item.productPrice * item.quantity).toLocaleString()}원</p>
                                <p class="text-muted small mb-0">${item.quantity}개</p>
                            </div>
                    </div>
                `;

                container.innerHTML += orderProducts;
            })
        }
    }

    async function loadPoint() {

    }

    function loadTotalAmount() {

    }

    function showDirectInput() {
        const select = document.getElementById('deliveryRequest');
        const directInput = document.getElementById('directInput');

        if (select.value === 'direct')
            directInput.classList.remove('d-none');
        else
            directInput.classList.add('d-none');
    }

    async function processPayment() {

    }

</script>
<!-- End Script -->
</body>
</html>
