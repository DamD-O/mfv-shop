<!DOCTYPE html>
<html lang="ko">

<head>
    <title>MFV - 결제</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/templatemo.css">
    <link rel="icon" href="assets/img/favicon.ico">

    <!-- Load fonts style after rendering the layout styles -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;200;300;400;500;700;900&display=swap">
    <link rel="stylesheet" href="assets/css/fontawesome.min.css">

</head>
<body>
<div id="header"></div>

<!--START CONTENT-->
<section class="py-5 bg-light">
    <div class="col-12 col-md-10 mx-auto">
        <h2>결제하기</h2>
        <p>아래 내용을 확인 후 결제를 완료해주세요.</p>
    </div>
    <div class="col-12 col-md-10 mx-auto border border-white p-4 bg-white" style="border-radius: 12px">
        <div class="bg-white rounded p-4 mb-3 shadow-sm border-0">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0">배송지</h5>
                <a class="text-success text-decoration-none small" data-bs-toggle="modal" data-bs-target="#addressModal">변경</a>
            </div>
            <div class="rounded p-3" style="background: #f8f9fa;" id="address-info"></div>
        </div>
        <div class="bg-white rounded p-4 mb-3 shadow-sm border-0">
            <h5>배송 요청사항</h5>
            <div class="row g-2 mb-4">
                <select id="deliveryRequest" class="form-select border border-dark rounded p-1" onchange="showDirectInput()">
                    <option value="">배송 시 요청사항을 선택해주세요</option>
                    <option value="문 앞에 놓아주세요">문 앞에 놓아주세요</option>
                    <option value="경비실에 맡겨주세요">경비실에 맡겨주세요</option>
                    <option value="직접 받겠습니다">직접 받겠습니다</option>
                    <option value="부재 시 연락주세요">부재 시 연락주세요</option>
                    <option value="direct">직접입력</option>
                </select>
                <textarea id="directInput" class="form-control mt-2 d-none" rows="8" placeholder="요청사항을 입력하세요." style="resize: none"></textarea>
            </div>
        </div>
        <div class="bg-white rounded p-4 mb-3 shadow-sm border-0">
            <h5>주문 상품 <span class="text-success" id="product-count"></span></h5>
            <div id="order-items"></div>
        </div>
        <div class="bg-white rounded p-4 mb-3 shadow-sm border-0">
            <div class="d-flex justify-content-between align-items-center">
                <h5 class="mb-0">포인트</h5>
                <p>보유 <span id="point"></span>P</p>
            </div>
            <div class="row g-2">
                <div class="col-8">
                    <input type="number" class="form-control" id="usePoint" min="0" placeholder="포인트 입력">
                </div>
                <div class="col-4">
                    <button class="btn btn-outline-success w-100" id="usePointBtn">전액사용</button>
                </div>
            </div>
        </div>
        <div class="bg-white rounded p-4 mb-3 shadow-sm border-0">
            <h5 class="border-bottom p-3 mb-3 d-flex justify-content-start">결제금액</h5>
            <div class="d-flex justify-content-between mb-1">
                <span>상품금액</span>
                <span id="total"></span>
            </div>
            <div class="d-flex justify-content-between mb-1 text-danger">
                <span>포인트 사용</span>
                <span id="using"></span>
            </div>
            <div class="d-flex justify-content-between mb-2 fw-bold">
                <span>배송지</span>
                <span>무료</span>
            </div>
            <div class="d-flex justify-content-between mb-2 fw-bold">
                <span>최종 결제 금액</span>
                <span id="totalPayment"></span>
            </div>
        </div>
        <div class="bg-white rounded p-4 mb-3 shadow-sm border-0">
            <h5 class="">결제수단</h5>
            <div class="d-flex gap-2">
                <input type="radio" name="payMethod" id="card" value="card" class="d-none">
                <label for="card" class="btn btn-outline-success px-4 py-2">신용/체크카드</label>

                <input type="radio" name="payMethod" id="transfer" value="transfer" class="d-none" disabled>
                <label for="transfer" class="btn btn-outline-secondary px-4 py-2">계좌이체</label>

                <input type="radio" name="payMethod" id="bank" value="bank" class="d-none" disabled>
                <label for="bank" class="btn btn-outline-secondary px-4 py-2">무통장입금</label>

                <input type="radio" name="payMethod" id="easypayment" value="easypayment" class="d-none" disabled>
                <label for="easypayment" class="btn btn-outline-secondary px-4 py-2">간편결제</label>
            </div>
        </div>
        <div class="bg-white rounded p-4 mb-3 shadow-sm border-0">
            <div class="d-flex align-items-center mb-3">
                <input type="checkbox" class="form-check-input me-2" id="agreeAll">
                <label for="agreeAll" class="fw-bold">전체 동의</label>
            </div>
            <hr>
            <div class="d-flex justify-content-between align-items-center mb-2">
                <div>
                    <input type="checkbox" class="form-check-input me-2 agree-item" id="agree1">
                    <label for="agree1"><span class="text-success">[필수]</span> 개인정보 수집 및 이용 동의</label>
                </div>
                <a class="text-muted small">보기 ›</a>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-2">
                <div>
                    <input type="checkbox" class="form-check-input me-2 agree-item" id="agree2">
                    <label for="agree2"><span class="text-success">[필수]</span> 개인정보 제3자 제공 동의</label>
                </div>
                <a class="text-muted small">보기 ›</a>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-2">
                <div>
                    <input type="checkbox" class="form-check-input me-2 agree-item" id="agree3">
                    <label for="agree3"><span class="text-success">[필수]</span> 결제대행 서비스 이용약관 동의</label>
                </div>
                <a class="text-muted small">보기 ›</a>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <input type="checkbox" class="form-check-input me-2 agree-item" id="agree4">
                    <label for="agree4"><span class="text-success">[필수]</span> 주문 내용 확인 및 결제 진행 동의</label>
                </div>
            </div>
            <button class="btn btn-success w-100 btn-lg" id="payBtn">
                <span id="pay-amount"></span> 결제하기
            </button>
        </div>
    </div>
</section>

<!--addressModal -->
<div class="modal fade" id="addressModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false" aria-labelledby="addressModal" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content p-3">
            <div class="modal-header border-0">
                <h5 class="modal-title fs-5">배송지 변경</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="address-list"></div>
                <hr>
                <div id="address-form">
                    <a class="btn btn-outline-success w-100" href="address-form.html?type=add">배송지 등록</a>
                </div>
            </div>
        </div>
    </div>
</div>

<!--END CONTENT-->
<div id="footer"></div>

<!-- Start Script -->
<script src="assets/js/jquery-1.11.0.min.js"></script>
<script src="assets/js/jquery-migrate-1.2.1.min.js"></script>
<script src="assets/js/templatemo.js"></script>
<script src="js/common.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let productTotal = 0;
    let seletedAddress = null;
    let currentDeliveryId = null;

    document.addEventListener("DOMContentLoaded", async () => {
        const orderItems = JSON.parse(sessionStorage.getItem("selectedItems")) || [];
        if (orderItems.length === 0) {
            alert('주문할 상품이 없습니다.');
            location.href = 'cart.html';
            return;
        }

        await checkLogin();
        await loadDeliveryAddress()
        loadOrderItems();
        await loadPoint();
        calcTotal();
    })

    document.getElementById('addressModal').addEventListener('show.bs.modal', () => {
        loadAddressList();
    });

    document.getElementById('usePointBtn').addEventListener('click', () => {
        const avail = parseInt(document.getElementById('point').innerText.replace(/,/g, ''))

        document.getElementById('usePoint').value = Math.min(avail, productTotal);
        calcTotal();
    });

    document.getElementById('usePoint').addEventListener('input', (e) => {
        if (e.target.value < 0) e.target.value = 0;
        calcTotal();
    })

    document.querySelectorAll('input[name="payMethod"]').forEach(radio => {
        radio.addEventListener('change', (e) => {
            document.querySelectorAll('input[name="payMethod"] + label').forEach(label => {
                label.className = 'btn btn-outline-secondary px-4 py-2';
            });
            e.target.nextElementSibling.className = 'btn btn-success px-4 py-2';
        });
    });

    document.getElementById('agreeAll').addEventListener('change', function () {
        document.querySelectorAll('.agree-item').forEach(check => {
            check.checked = this.checked;
        });
    });

    document.getElementById('payBtn').addEventListener('click', () => {
        const payMethod = document.querySelector('input[name="payMethod"]:checked');
        if (!payMethod) {
            alert('결제 수단을 선택해주세요.');
            return;
        }

        let allChecked = true;
        document.querySelectorAll('.agree-item').forEach(item => {
            if (!item.checked) allChecked = false;
        });

        if (!allChecked) {
            alert('필수 약관에 모두 동의해주세요.');
            return;
        }

        processPayment();

    });

    async function checkLogin() {
        const response = await fetch('/api/customers/my', {credentials: "include"});
        if (!response.ok) {
            location.href = 'login.html';
        }
    }

    async function loadDeliveryAddress() {
        const response = await fetchWithAuth(`/api/customers/address`);
        if (!response) return;

        const data = await response.json();

        const container = document.getElementById('address-info');
        container.innerHTML = '';

        if (data.length === 0) {
            container.innerHTML = `
              <p class="text-muted">등록된 배송지가 없습니다. 배송지를 등록하세요.</p>
              <a href="address-form.html?type=add" class="btn btn-outline-info" btn-sm>배송지 등록</a>
            `;
        } else {
            let address;

            if (seletedAddress)
                address = seletedAddress;
            else {
                address = data.find(item => item.default) || data[0];
            }

            currentDeliveryId = address.deliveryId;

            container.innerHTML = `
                <p class="fw-normal mb-2 fs-6">${address.addressName} (${address.receiver})  ${address.default ? '<span class="badge rounded-pill bg-success ms-1" style="font-size: 12px;">기본배송지</span>' : ''}</p>
                <p class="fw-light mb-2 fs-6">(${address.zipcode}) ${address.roadAddress}</p>
                <p class="fw-light mb-2 fs-6">${address.detailAddress}</p>
                <p style="font-size: 11px">${address.contact}</p>
            `;
        }
    }

    async function loadAddressList() {
        const response = await fetchWithAuth(`/api/customers/address`);
        if (!response) return;

        const data = await response.json();

        const container = document.getElementById('address-list');
        container.innerHTML = '';

        if (data) {
            data.forEach(address => {
                const card = `
                    <div class="d-flex align-items-start py-3 border-top">
                        <input type="radio" name="addressSelect" class="me-3 mt-1" value="${address.deliveryId}" ${address.default ? 'checked' : ''}>
                        <div class="flex-grow-1">
                            <p class="fw-bold mb-1">${address.addressName} (${address.receiver})
                            ${address.default ? '<span class="badge bg-secondary">기본배송지</span>' : ''}
                            </p>
                            <p class="mb-1">(${address.zipcode}) ${address.roadAddress}</p>
                            <p class="mb-1">${address.detailAddress}</p>
                            <p>${address.contact}</p>
                        </div>
                        <div class="d-flex flex-column align-item-end gap-1 text-nowrap">
                            <a class="text-muted small" href="address-form.html?type=update&deliveryId=${address.deliveryId}">수정</a>
                            <a class="text-danger small" onclick="deleteAddress(${address.deliveryId}, ${address.default})">삭제</a>
                        </div>
                    </div>
                `;

                container.innerHTML += card;
            });

            const targetId = seletedAddress ? seletedAddress.deliveryId : data.find(a => a.default)?.deliveryId;
            document.querySelector(`input[value="${targetId}"]`).checked = true;

            document.querySelectorAll('input[name="addressSelect"]').forEach(radio => {
                radio.addEventListener('change', (e) => {
                    seletedAddress = data.find(a => a.deliveryId == e.target.value);
                    loadDeliveryAddress(seletedAddress);

                    document.querySelector('#addressModal .btn-close').click();
                });
            });
        }
    }

    async function deleteAddress(deliveryId, isDefault) {
        if (isDefault) {
            alert('기본배송지는 삭제 할 수 없습니다.');
            return;
        }

        if (!confirm('배송지를 삭제하시겠습니까?')) return;

        const response = await fetch(`/api/customers/address/${deliveryId}`, {
            method: 'DELETE',
            credentials: "include"
        });

        if (response.ok) {
            //선택된 배송지가 삭제된 경우 초기화
            if (seletedAddress?.deliveryId == deliveryId) {
                seletedAddress = null;
            }

            loadDeliveryAddress();
            loadAddressList();
        } else {
            const error = await response.json();
            alert(error.message || '배송지 삭제 실패');
        }
    }

    function loadOrderItems() {
        const orderItems = JSON.parse(sessionStorage.getItem('selectedItems')) || [];

        document.getElementById("product-count").innerText = orderItems.length;

        const container = document.getElementById('order-items');
        container.innerHTML = '';

        if (orderItems) {
            orderItems.forEach(item => {
                const img = item.imageUrl ? `
                    <div style="width:80px; height:80px; background:#f8f9fa; border-radius:8px; padding:5px;">
                        <img src="${item.imageUrl}" class="img-fluid" style="width:100%; height:100%; object-fit:cover;">
                    </div>`
                    : `<div style="width:80px; height:80px; background:#f8f9fa; border-radius:8px;"></div>`;

                const orderProducts = `
                    <div class="row align-items-center py-3 border-bottom">
                       <div class="col-12 col-md-2 d-flex align-items-center">${img}</div>
                            <div class="col-12 col-md-6">
                                <p class="fw-bold mb-0">${item.productName} </p>
                                <p class="text-muted small mb-0">${item.unit}</p>
                            </div>
                            <div class="col-12 col-md-4 text-end">
                                <p class="fw-bold mb-0">${(item.productPrice * item.quantity).toLocaleString()}원</p>
                                <p class="text-muted small mb-0">${item.quantity}개</p>
                            </div>
                    </div>
                `;

                container.innerHTML += orderProducts;

                productTotal += (item.productPrice * item.quantity);
            });
        }
    }

    function calcTotal() {
        let usePoint = parseInt(document.getElementById('usePoint').value) || 0;

        if (usePoint > productTotal) {
            usePoint = productTotal;
            document.getElementById('usePoint').value = productTotal;

        }

        const avail = parseInt(document.getElementById('point').innerText.replace(/,/g, ''));
        if (usePoint > avail) {
            usePoint = avail;
            document.getElementById('usePoint').value = avail;
        }

        const finalAmount = productTotal - usePoint;
        document.getElementById('total').innerText = productTotal.toLocaleString() + '원';
        document.getElementById('using').innerText = ' - ' + usePoint + '원'
        document.getElementById('totalPayment').innerText = finalAmount.toLocaleString() + '원';
        document.getElementById('pay-amount').innerText = finalAmount.toLocaleString() + '원';
    }

    async function loadPoint() {
        const response = await fetchWithAuth(`/api/customers/points`);
        if (!response) return;

        const data = await response.json();
        document.getElementById("point").innerText = data.availPoint.toLocaleString();
    }

    function showDirectInput() {
        const select = document.getElementById('deliveryRequest');
        const directInput = document.getElementById('directInput');

        if (select.value === 'direct')
            directInput.classList.remove('d-none');
        else
            directInput.classList.add('d-none');
    }

    async function processPayment() {
        const orderItems = JSON.parse(sessionStorage.getItem('selectedItems')) || [];
        const usePoint = parseInt(document.getElementById('usePoint').value) || 0;
        const deliveryRequest = document.getElementById('deliveryRequest').value === 'direct' ? document.getElementById('directInput').value : document.getElementById('deliveryRequest').value;

        const response = await fetchWithAuth(`/api/customers/orders`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                deliveryId: seletedAddress?.deliveryId || currentDeliveryId,
                orderItemRequest: orderItems.map(item => ({
                    productId: item.productId,
                    quantity: item.quantity
                })),
                usePoint: usePoint,
                deliveryRequest: deliveryRequest
            })
        });

        if (!response) return;

        if (response.ok) {
            const data = await response.json();

            const payResponse = await fetchWithAuth(`/api/customers/orders/${data.orderId}/payment`, {
                method: 'POST',
                credentials: 'include'
            });

            if (!payResponse) return;

            const cart = JSON.parse(sessionStorage.getItem('cart')) || [];
            const orderedProductIds = orderItems.map(item => item.productId);
            const updateCart = cart.filter(item => !orderedProductIds.includes(item.productId));
            sessionStorage.setItem('cart', JSON.stringify(updateCart));
            sessionStorage.removeItem('selectedItems');

            if (payResponse.ok) {
                location.href = `order.html?orderId=${data.orderId}`;
            } else {
                const error = await payResponse.json();
                alert(error.message || '결제에 실패하였습니다. 다시 시도해주세요.');
                location.href = `order.html?orderId=${data.orderId}`;
            }
        }
    }

</script>
<!-- End Script -->
</body>
</html>
