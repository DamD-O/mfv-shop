<!DOCTYPE html>
<html lang="ko">
<head>
    <title>MFV - Login</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/templatemo.css">
    <link rel="icon" href="assets/img/favicon.ico">

    <!-- Load fonts style after rendering the layout styles -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;200;300;400;500;700;900&display=swap">
    <link rel="stylesheet" href="assets/css/fontawesome.min.css">
</head>

<body>
<div id="header"></div>

<!-- Start Login Section -->
<section class="container my-5">
    <div class="container border border-dark rounded p-4">
        <h2 class="text-center text-success mb-4">로그인</h2>
        <div id="loginError" class="alert alert-danger d-none"></div>
        <div class="mb-3">
            <label for="customerId" class="form-label">아이디</label>
            <input type="text" class="form-control" id="customerId" placeholder="아이디를 입력하세요">
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">비밀번호</label>
            <input type="password" class="form-control" id="password" placeholder="비밀번호를 입력하세요">
        </div>
        <div class="d-grid mb-3">
            <button class="btn btn-success" onclick="login()">로그인</button>
        </div>
        <div class="text-center">
            <span class="text-dark">계정이 없으신가요?</span>
            <a href="signup.html" class="text-success text-decoration-none ms-1 fw-bold">회원가입</a>
        </div>
    </div>
</section>
<!-- End Login Section -->
<div id="footer"></div>

<!-- Start Script -->
<script src="assets/js/jquery-1.11.0.min.js"></script>
<script src="assets/js/jquery-migrate-1.2.1.min.js"></script>
<script src="assets/js/templatemo.js"></script>
<script src="js/common.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    async function login() {

        const customerId = document.getElementById('customerId').value;
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('loginError');
        errorDiv.classList.add('d-none');  //에러 메세지 초기화

        const formData = new URLSearchParams();
        formData.append('username', customerId);
        formData.append('password', password);

        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: formData
            });

            const params = new URLSearchParams(location.search);
            const redirect = params.get('redirect');

            if (response.ok) {
                location.href = redirect ? decodeURIComponent(redirect) : 'index.html';
            } else {
                errorDiv.textContent = '아이디 또는 비밀번호가 올바르지 않습니다.';
                errorDiv.classList.remove('d-none');
            }
        } catch (error) {
            errorDiv.textContent = '로그인 중 오류가 발생했습니다.';
            errorDiv.classList.remove('d-none');
        }
    }

    // 엔터키로 로그인
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') login();
    });
</script>
<!-- End Script -->
</body>
</html>
