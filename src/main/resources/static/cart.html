<!DOCTYPE html>
<html lang="ko">

<head>
    <title>MFV - 장바구니</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/templatemo.css">
    <link rel="icon" href="assets/img/favicon.ico">

    <!-- Load fonts style after rendering the layout styles -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;200;300;400;500;700;900&display=swap">
    <link rel="stylesheet" href="assets/css/fontawesome.min.css">

</head>
<body>
<div id="header"></div>

<!--START CONTENT-->
<section class="py-5">
    <div class="col-12 col-md-10 mx-auto border border-white p-4" style="border-radius: 12px">
        <div class="row py-3 border-bottom d-flex justify-content-between">
            <div class="col-auto">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="check-all">
                    <label class="form-check-label" for="check-all">전체선택</label>
                </div>
            </div>
            <div class="col-auto">
                <button type="button" id="delete-item" onclick="deleteSelected()" class="btn btn-outline-danger btn-sm">선택 삭제</button>
            </div>
        </div>
        <div id="cart-items"></div>
        <div class="row py-3 border-top">
            <div class="col text-end">
                <strong>총 금액: <span id="total-price"></span></strong>
            </div>
        </div>
        <div class="row py-5">
            <a class="btn btn-outline-success" id="payment-btn" onclick="goPayment()">구매하기</a>
        </div>
    </div>
</section>

<!--END CONTENT-->
<div id="footer"></div>

<!-- Start Script -->
<script src="assets/js/jquery-1.11.0.min.js"></script>
<script src="assets/js/jquery-migrate-1.2.1.min.js"></script>
<script src="assets/js/templatemo.js"></script>
<script src="js/common.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        setOrders();
        document.getElementById('check-all').addEventListener('change', function () {
            document.querySelectorAll('.item-check').forEach(check => {
                check.checked = this.checked;
            });
        });
    })

    async function setOrders() {
        const cart = JSON.parse(sessionStorage.getItem('cart')) || [];

        const container = document.getElementById('cart-items');
        container.innerHTML = '';

        if (cart.length === 0) {
            container.innerHTML = `
                <div class="text-center py-5">
                    <p class="fw-bold">장바구니가 비었습니다.</p>
                    <a href="shop.html" class="btn btn-success mt-3">상품 보러가기</a>
                </div>
            `;
        } else {
            cart.forEach(item => {
                const img = item.imageUrl ? `
                            <img src="${item.imageUrl}" class="img-fluid">` : '<span>상품이미지 없음</span>';

                const info = `
                        <div class="row align-items-center py-3 border-bottom">
                            <div class="col-12 col-md-1"><input type="checkbox" class="item-check" data-product-id="${item.productId}"></div>
                            <div class="col-12 col-md-2">${img}</div>
                            <div class="col-12 col-md-5">
                                <p>${item.productName}</p>
                                <p>${item.unit}당 ${item.productPrice}원</p>
                                <p class="product-total" data-price="${item.productPrice * item.quantity}">총: ${item.productPrice * item.quantity}원</p>
                            </div>
                            <div class="col-12 col-md-3">
                                <input type="number" value="${item.quantity}" min="1" class="form-control border-success" style="width: 80px;"
                                onchange="updateQuantity(${item.productId}, this.value)">
                            </div>
                            <div class="col-12 col-md-1">
                                <button onclick="deleteItem(${item.productId})">삭제</button>
                            </div>
                        </div>`;

                container.innerHTML += info;
            });

            calcTotal();
        }
    }

    async function updateQuantity(productId, value) {
        const cart = JSON.parse(sessionStorage.getItem('cart')) || [];
        const item = cart.find(item => item.productId == productId);

        if (item) {
            item.quantity = parseInt(value);
        }

        sessionStorage.setItem('cart', JSON.stringify(cart))
        setOrders();
        calcTotal();
    }

    function calcTotal() {
        const cart = JSON.parse(sessionStorage.getItem('cart')) || [];

        let total = 0;
        cart.forEach(item => {
            total += item.productPrice * item.quantity;
        });

        document.getElementById('total-price').innerText = total + '원';
    }

    function deleteSelected() {
        const checked = document.querySelectorAll('.item-check:checked');
        let cart = JSON.parse(sessionStorage.getItem('cart')) || [];

        checked.forEach(check => {
            const id = parseInt(check.dataset.productId);
            cart = cart.filter(item => item.productId != id)
        })

        sessionStorage.setItem('cart', JSON.stringify(cart));
        setOrders();
        calcTotal();
        updateCartCount();
    }

    function deleteItem(productId) {
        let cart = JSON.parse(sessionStorage.getItem('cart')) || [];
        cart = cart.filter(item => item.productId != productId);
        sessionStorage.setItem('cart', JSON.stringify(cart));
        setOrders();
        calcTotal();
        updateCartCount();
    }

    async function goPayment() {
        const checked = document.querySelectorAll('.item-check:checked');
        const cart = JSON.parse(sessionStorage.getItem('cart')) || [];

        if (cart.length === 0) {
            alert('장바구니에 상품이 없습니다. 상품을 추가해주세요.');
            return;
        }

        if (checked.length === 0) {
            alert('구매할 상품을 선택해주세요.');
            return;
        }

        const response = await fetchWithAuth(`/api/customers/my`);
        if (!response) return;

        if (response.ok) {
            //선택된 상품만 결제페이지에 넘기기
            const selectedIds = [...checked].map(check => parseInt(check.dataset.productId));
            const selectedItems = cart.filter(item => selectedIds.includes(parseInt(item.productId)));
            sessionStorage.setItem('selectedItems', JSON.stringify(selectedItems));

            window.location.href = 'payment.html';
        } else {
            const error = await response.json();
            alert(error.message || '에러가 발생하였습니다. 관리자에게 문의하세요.');
        }
    }
</script>
<!-- End Script -->
</body>
</html>
