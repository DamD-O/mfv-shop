<!DOCTYPE html>
<html lang="ko">
<head>
    <title>MFV - 고객센터</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/templatemo.css">
    <link rel="icon" href="assets/img/favicon.ico">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;200;300;400;500;700;900&display=swap">
    <link rel="stylesheet" href="assets/css/fontawesome.min.css">
</head>
<body>
<div id="header"></div>
<section class="py-5 bg-light">
    <div class="col-12 col-md-10 mx-auto">
        <h3>고객센터</h3>
    </div>
    <div class="col-12 col-md-10 mx-auto border border-white p-4 bg-white" style="border-radius: 12px">
        <ul class="nav nav-tabs mb-4">
            <li class="nav-item">
                <button type="button" class="nav-link active" data-bs-toggle="tab" data-bs-target="#notice-tab">공지사항</button>
            </li>
            <li class="nav-item">
                <button type="button" class="nav-link" data-bs-toggle="tab" data-bs-target="#personal-tab">1:1 문의</button>
            </li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="notice-tab">
                <div id="notice-list" class="list-group list-group-flush"></div>
                <p id="notice-empty" class="text-muted d-none">등록된 공지사항이 없습니다.</p>
                <nav id="notice-pagination" class="d-none">
                    <ul class="pagination pagination-sm justify-content-center mt-3 mb-0"></ul>
                </nav>
            </div>

            <div class="tab-pane fade" id="personal-tab">
                <p class="text-muted small mb-4">회원 정보 변경, 주문 / 배송 등 궁금한 점을 남겨 주세요. 작성한 문의와 답변은 마이페이지 &gt; 나의 Q&A 내역에서 확인할 수 있습니다.</p>
                <div class="mb-3">
                    <label for="personal-title" class="form-label small fw-bold">제목</label>
                    <input type="text" class="form-control" id="personal-title" maxlength="100">
                </div>
                <div class="mb-3">
                    <label for="personal-content" class="form-label small fw-bold">내용</label>
                    <textarea class="form-control" id="personal-content" rows="6" maxlength="1000"></textarea>
                </div>
                <p class="text-danger small d-none" id="personal-error"></p>
                <div class="text-end">
                    <button type="button" class="btn btn-success" id="personal-submit">문의 등록</button>
                </div>
            </div>
        </div>
    </div>
</section>
<div id="footer"></div>

<script src="assets/js/jquery-1.11.0.min.js"></script>
<script src="assets/js/jquery-migrate-1.2.1.min.js"></script>
<script src="assets/js/templatemo.js"></script>
<script src="js/common.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", async function () {
        await loadNotice();

        const hash = location.hash.replace('#', '');
        if (hash === 'personal') {
            const btn = document.querySelector('[data-bs-target="#personal-tab"]');
            bootstrap.Tab.getOrCreateInstance(btn).show();
        }

        initPagination('#notice-pagination', loadNotice);

        document.getElementById('personal-submit').addEventListener('click', async (e) => {
            const btn = e.currentTarget;

            if (!btn) return;

            btn.disabled = true;
            try {
                await submitQna();
            } finally {
                btn.disabled = false;
            }
        });

    });

    async function loadNotice(page = 0) {
        const response = await fetch(`/api/notice?page=${page}`);

        if (response.ok) {
            const data = await response.json();

            document.getElementById('notice-empty').classList.toggle('d-none', data.content.length > 0);
            document.getElementById('notice-pagination').querySelector('ul').innerHTML = renderPagination(data);
            document.getElementById('notice-pagination').classList.toggle('d-none', data.totalPage < 2);
            document.getElementById('notice-list').innerHTML = data.content.map(renderNoticeRow).join('');

        } else {
            const error = await response.json().catch(() => ({}));
            alert(error.message || '공지사항 목록 조회 실패');

        }
    }

    async function submitQna() {
        if (!validate()) return;

        document.getElementById('personal-error').classList.add('d-none');

        const response = await fetchWithAuth('/api/customers/qna/personal', {
            method: "POST",
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                title: document.getElementById("personal-title").value.trim(),
                content: document.getElementById("personal-content").value.trim()
            })
        });

        if (!response) return;

        if (!response.ok) {
            const error = await response.json().catch(() => ({}));
            document.getElementById('personal-error').textContent = error.message || '1:1 문의 등록 실패';
            document.getElementById('personal-error').classList.remove('d-none');

            return;
        }

        alert('1:1 문의 등록 성공');
        location.href = 'mypage.html#qna';
    }

    function validate() {
        const title = document.getElementById("personal-title").value.trim();
        const content = document.getElementById("personal-content").value.trim();

        if (!title) {
            document.getElementById('personal-error').textContent = '제목을 입력하세요.';
            document.getElementById('personal-error').classList.remove('d-none');
            return false;
        }

        if (!content) {
            document.getElementById('personal-error').textContent = '내용을 입력하세요.';
            document.getElementById('personal-error').classList.remove('d-none');
            return false;
        }

        return true;
    }

    function renderNoticeRow(data) {
        return `
            <a href="notice.html?noticeId=${data.noticeId}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-3">
                <span class="text-truncate me-3">${escapeHtml(data.title)}</span>
                <small class="text-muted flex-shrink-0">${data.createdAt.split('T')[0]}</small>
            </a>
        `;
    }
</script>
</body>
</html>
