<!DOCTYPE html>
<html lang="ko">

<head>
    <title>MFV - 주문 상세 내역</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/templatemo.css">
    <link rel="icon" href="assets/img/favicon.ico">

    <!-- Load fonts style after rendering the layout styles -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;200;300;400;500;700;900&display=swap">
    <link rel="stylesheet" href="assets/css/fontawesome.min.css">

</head>
<body>
<div id="header"></div>
<section class="py-5 bg-light">
    <div class="col-12 col-md-10 mx-auto">
        <h3>주문 내역</h3>
        <div class="bg-white rounded p-4 mb-3 shadow-sm">
            <div class="d-flex justify-content-between align-items-center" style="border-radius: 12px">
                <div>
                    <p class="text-muted small mb-1">주문 번호</p>
                    <h5 class="mb-0">#<span id="orderId"></span></h5>
                </div>
                <div>
                    <p class="text-muted small mb-1">주문 상태</p>
                    <h5 class="mb-0"><span id="order-status"></span></h5>
                </div>
                <div>
                    <p class="text-muted small mb-1">주문 일자</p>
                    <h5 class="mb-0"><span id="order-date"></span></h5>
                </div>
            </div>
        </div>
        <div class="bg-white rounded p-4 mb-3 shadow-sm">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h5 class="mb-0">배송지</h5>
            </div>
            <div class="rounded p-3 mb-4" style="background: #f8f9fa;">
                <p id="reciver"></p>
                <p id="address-info"></p>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0">배송 요청사항</h5>
            </div>
            <div class="rounded p-3" style="background: #f8f9fa;">
                <p id="deliveryRequest"></p>
            </div>
        </div>
        <div class="bg-white rounded p-4 mb-3 shadow-sm">
            <h5>주문 상품 <span class="text-success" id="product-count"></span></h5>
            <div class="bg-white rounded shadow-sm p-0 overflow-hidden">
                <table class="table align-middle small mb-0">
                    <thead class="border-bottom border-dark">
                    <tr>
                        <th class="text-center" style="width: 35%;">상품</th>
                        <th class="text-center" style="width: 10%;">수량</th>
                        <th class="text-center" style="width: 15%;">주문금액</th>
                    </tr>
                    </thead>
                    <tbody id="order-items"></tbody>
                </table>
            </div>
        </div>
        <div class="bg-white rounded p-4 mb-3 shadow-sm">
            <h5>결제 금액</h5>
            <div class="d-flex justify-content-between mb-1">
                <span>상품금액</span>
                <span id="total-amount"></span>
            </div>
            <div class="d-flex justify-content-between mb-1 text-danger">
                <span>포인트 사용</span>
                <span id="use-point"></span>
            </div>
            <div class="d-flex justify-content-between fw-bold">
                <span>최종 결제금액</span>
                <span id="final-amount"></span>
            </div>
        </div>
        <div class="d-flex gap-2 mt-3">
            <button class="btn btn-outline-secondary" onclick="location.href='orders.html'">목록</button>
            <div id="order-buttons" class="d-flex gap-2"></div>
        </div>
    </div>
</section>

<div id="footer"></div>

<!-- Start Script -->
<script src="assets/js/jquery-1.11.0.min.js"></script>
<script src="assets/js/jquery-migrate-1.2.1.min.js"></script>
<script src="assets/js/templatemo.js"></script>
<script src="js/common.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", async function () {
        if (!await checkLogin()) return;

        const params = new URLSearchParams(location.search);
        const orderId = params.get('orderId');

        document.getElementById("orderId").innerText = orderId;
        setOrderDetails(orderId);
    });

    async function setOrderDetails(orderId) {
        const response = await fetchWithAuth(`/api/customers/orders/${orderId}`);

        if (!response) return;

        if (response.ok) {
            const data = await response.json();

            document.getElementById("product-count").innerText = data.orderDetails.length;
            document.getElementById("order-status").innerText = data.orderStatusLabel;
            document.getElementById('order-date').innerText = data.createdAt.split('T')[0];
            document.getElementById('total-amount').innerText = data.totalAmount.toLocaleString();
            document.getElementById('use-point').innerText = '- ' + data.usePoint.toLocaleString();
            document.getElementById('final-amount').innerText = (data.totalAmount - data.usePoint).toLocaleString();

            const orderContent = document.getElementById('order-items');
            orderContent.innerHTML = '';

            if (data) {
                const address = data.addressSnapshot;
                const reciver = address.split('/')[0];
                document.getElementById('reciver').innerText = reciver;
                document.getElementById('address-info').innerText = address.split('/')[1];

                const deliveryRequest = data.deliveryRequest;
                document.getElementById('deliveryRequest').innerText = deliveryRequest != null ? deliveryRequest : '요청사항 없음';

                data.orderDetails.forEach((detail) => {
                    const card = `
                    <tr>
                         <td class="border-top">
                            <div class="d-flex align-items-center">
                                ${detail.imageUrl ? `<img src="${detail.imageUrl}" style="width:50px; height:50px; object-fit:cover; border-radius:4px;" class="me-2">`
                        : `<div style="width:50px; height:50px; background:#f0f0f0; border-radius:4px; flex-shrink:0;" class="me-2"></div>`}
                            <p class="mb-0">${detail.productName}</p>
                            </div>
                        </td>
                        <td class="text-center border-top">${detail.quantity}</td>
                    <td class="text-center border-top">${(detail.priceAtOrder * detail.quantity).toLocaleString()}원</td>
                    </tr>
                `;
                    orderContent.innerHTML += card;
                });

                document.getElementById("order-buttons").innerHTML = getStatusButtons(data);
            }
        }
    }

    function getStatusButtons(data) {
        if (data.orderStatus === 'PAYMENT_PENDING') {
            return `
                <button class="btn btn-outline-success" onclick="rePayment(${data.orderId})">재결제</button>
                <button class="btn btn-outline-danger" onclick="cancelOrder(${data.orderId})">취소</button>
            `
        } else if (data.orderStatus === 'PAYMENT_COMPLETE' || data.orderStatus === 'PREPARING') {
            return `<button class="btn btn-outline-danger" onclick="cancelOrder(${data.orderId})">취소</button>`
        } else if (data.orderStatus === 'SHIPPING') {
            return `<button class="btn btn-outline-dark" disabled>배송조회</button>`
        }

        return '';
    }

    async function rePayment(orderId) {
        if (!confirm('결제를 진행하시겠습니까?')) return;
        const response = await fetchWithAuth(`/api/customers/orders/${orderId}/payment`, {
            method: 'POST',
            credentials: 'include'
        });

        if (!response) return;

        if (response.ok) {
            location.href = `order.html?orderId=${orderId}`;
        } else {
            const error = await response.json();
            alert(error.message || '결제에 실패하였습니다. 다시 시도해주세요.');
            location.href = 'orders.html';
        }
    }

    async function cancelOrder(orderId) {
        if (!confirm('주문을 취소하시겠습니까?')) return;

        const response = await fetchWithAuth(`/api/customers/orders/${orderId}/cancel`, {
            method: 'PATCH',
            credentials: "include"
        });
        if (!response) return;

        if (response.ok) {
            location.href = 'orders.html';
        } else {
            const error = await response.json();
            alert(error.message || '주문 취소 실패하였습니다. 다시 시도해주세요.');
            location.href = 'orders.html';
        }
    }
</script>
</body>
</html>
