<!DOCTYPE html>
<html lang="ko">

<head>
    <title>MFV - 상품 상세</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/templatemo.css">
    <link rel="icon" href="assets/img/favicon.ico">

    <!-- Load fonts style after rendering the layout styles -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;200;300;400;500;700;900&display=swap">
    <link rel="stylesheet" href="assets/css/fontawesome.min.css">

    <style>
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            opacity: 1;
        }
    </style>

</head>
<body>
<div id="header"></div>

<!-- Modal -->
<div class="modal fade bg-white" id="templatemo_search" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="w-100 pt-1 mb-5 text-right">
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form action="" method="post" class="modal-content modal-body border-0 p-0">
            <div class="input-group mb-2">
                <input type="text" class="form-control" id="inputModalSearch" name="q" placeholder="Search ...">
                <button type="submit" class="input-group-text bg-success text-light">
                    <i class="fa fa-fw fa-search text-white"></i>
                </button>
            </div>
        </form>
    </div>
</div>
<!-- Open Content -->
<section class="bg-light">
    <div class="container pb-5">
        <div class="row">
            <div class="col-lg-5 mt-5">
                <div class="card mb-3">
                    <img class="card-img img-fluid" id="product-detail">
                </div>
            </div>
            <!-- col end -->
            <div class="col-lg-7 mt-5">
                <div class="card">
                    <div class="card-body">
                        <h1 class="h2" id="product-name"></h1>
                        <!--별점 영역-->
                        <p class="h4 py-2">단위 가격: <span id="product-price"></span></p>
                        <p>원산지 : <span id="product-origin"></span></p>
                        <p>보관방법: <span id="product-storage"></span></p>
                        <p>상품 설명: <span id="product-description"></span></p>
                        <p>배송비: 무료배송</p>
                        <p>포인트 적립: 결제금액의 1.5%</p>
                        <div class="d-flex align-items-center gap-2">
                            <label>수량</label>
                            <input type="number" id="quantity" value="1" min="1" class="form-control border-success" style="width: 80px;">
                            <button class="btn btn-success" id="btn-add-to-cart">장바구니 담기</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<!-- Close Content -->

<div id="footer"></div>
<!-- Start Script -->
<script src="assets/js/jquery-1.11.0.min.js"></script>
<script src="assets/js/jquery-migrate-1.2.1.min.js"></script>
<script src="assets/js/templatemo.js"></script>
<script src="js/common.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        getProduct();
    });

    async function getProduct() {

        const params = new URLSearchParams(window.location.search);
        const productId = params.get('productId')

        const response = await fetch(`/api/products/${productId}`);
        const data = await response.json();

        let name = data.productName;
        let price = data.productPrice;
        let unit = data.unit;
        let image = data.productImageUrl;

        document.getElementById('product-detail').src = image || '';
        document.getElementById('product-detail').alt = name;
        document.getElementById('product-name').innerText = name;
        document.getElementById('product-price').innerText = unit + '당 \t' + price + '원';
        document.getElementById('product-origin').innerText = data.origin;
        document.getElementById('product-storage').innerText = data.storageMethod;
        document.getElementById('product-description').innerText = data.description;

        document.getElementById('btn-add-to-cart').addEventListener('click', () => {
            const quantity = document.getElementById('quantity').value;
            addToCart(productId, name, price, unit, image, quantity)
        })
    }

    //장바구니 추가 : btn-add-to-cart
    function addToCart(productId, productName, productPrice, unit, imageUrl, quantity) {

        //기존 장바구니 가져오기
        const cart = JSON.parse(sessionStorage.getItem('cart')) || [];

        //이미 담겨있으면 수량만 증가
        const existingCart = cart.find(item => item.productId === productId);

        if (existingCart)
            existingCart.quantity += parseInt(quantity);
        else
            cart.push({productId, productName, productPrice, unit, imageUrl, quantity: parseInt(quantity)});

        //장바구니 저장
        sessionStorage.setItem('cart', JSON.stringify(cart));
        updateCartCount()
        alert('장바구니에 추가되었습니다.')
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- End Script -->
</body>
</html>
