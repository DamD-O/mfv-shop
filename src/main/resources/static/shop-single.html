<!DOCTYPE html>
<html lang="ko">

<head>
    <title>MFV - 상품 상세</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/templatemo.css">
    <link rel="icon" href="assets/img/favicon.ico">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;200;300;400;500;700;900&display=swap">
    <link rel="stylesheet" href="assets/css/fontawesome.min.css">

    <style>
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            opacity: 1;
        }

        .nav-underline .nav-link {
            color: #6c757d;
            font-weight: 500;
        }

        .nav-underline .nav-link.active {
            color: #198754;
            border-bottom-color: #198754;
        }
    </style>

</head>
<body>
<div id="header"></div>
<div class="modal fade bg-white" id="templatemo_search" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="w-100 pt-1 mb-5 text-right">
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form action="" method="post" class="modal-content modal-body border-0 p-0">
            <div class="input-group mb-2">
                <input type="text" class="form-control" id="inputModalSearch" name="q" placeholder="Search ...">
                <button type="submit" class="input-group-text bg-success text-light">
                    <i class="fa fa-fw fa-search text-white"></i>
                </button>
            </div>
        </form>
    </div>
</div>
<!-- 상품정보 -->
<section class="bg-light">
    <div class="container pb-5">
        <div class="row">
            <div class="col-lg-5 mt-5">
                <div class="card mb-3">
                    <img class="card-img img-fluid" id="product-detail">
                </div>
            </div>
            <div class="col-lg-7 mt-5">
                <div class="card">
                    <div class="card-body">
                        <h1 class="h2" id="product-name"></h1>
                        <!--별점 영역-->
                        <p class="h4 py-2">단위 가격: <span id="product-price"></span></p>
                        <p>원산지 : <span id="product-origin"></span></p>
                        <p>보관방법: <span id="product-storage"></span></p>
                        <p>상품 설명: <span id="product-description"></span></p>
                        <p>배송비: 무료배송</p>
                        <p>포인트 적립: 결제금액의 1.5%</p>
                        <div class="d-flex align-items-center gap-2">
                            <label>수량</label>
                            <input type="number" id="quantity" value="1" min="1" class="form-control border-success" style="width: 80px;">
                            <button class="btn btn-success" id="btn-add-to-cart">장바구니 담기</button>
                        </div>
                        <div class="mt-3 fs-5 fw-bold" id="product-stock"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<!--리뷰 / 문의목록-->
<section class="py-5">
    <div class="container">
        <ul class="nav nav-underline border-bottom" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="review-tab" data-bs-toggle="tab" data-bs-target="#review-pane" type="button" role="tab">
                    상품 리뷰 <span class="small" id="review-count"></span>
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="qna-tab" data-bs-toggle="tab" data-bs-target="#qna-pane" type="button" role="tab">
                    상품 문의 <span class="small" id="qna-count"></span>
                </button>
            </li>
        </ul>
        <div class="tab-content pt-4">
            <div class="tab-pane fade show active" id="review-pane" role="tabpanel">
                <div id="review-list"></div>
                <div class="text-center mt-3">
                    <button type="button" id="review-more" class="btn btn-outline-success btn-sm d-none">리뷰 더보기</button>
                </div>
                <p id="review-empty" class="text-muted text-center py-5 d-none">등록된 리뷰가 없습니다.</p>
            </div>
            <div class="tab-pane fade" id="qna-pane" role="tabpanel">
                <div class="d-flex justify-content-end mb-3">
                    <button class="btn btn-outline-success btn-sm" id="qna-write-btn" type="button" data-bs-toggle="collapse" data-bs-target="#qna-form">문의하기</button>
                </div>
                <p id="qna-login-notice" class="text-muted d-none">문의 작성은 로그인 후 이용할 수 있습니다. <a id="qna-login-link">로그인</a></p>
                <div class="collapse" id="qna-form">
                    <div class="card card-body bg-white mb-4">
                        <div class="mb-3">
                            <input type="text" class="form-control" id="qna-title" placeholder="제목">
                        </div>
                        <div class="mb-3">
                            <textarea class="form-control" id="qna-content" rows="4" placeholder="문의 내용을 입력하세요"></textarea>
                        </div>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="qna-secret">
                                <label class="form-check-label" for="qna-secret">비밀글</label>
                            </div>
                            <button class="btn btn-success" id="qna-submit" type="button" onclick="createQna()">등록</button>
                        </div>
                    </div>
                </div>
                <div class="accordion" id="qna-list"></div>
                <div class="text-center mt-3">
                    <button type="button" id="qna-more" class="btn btn-outline-success btn-sm d-none">문의 더보기</button>
                </div>
                <p id="qna-empty" class="text-muted text-center py-5 d-none">등록된 문의가 없습니다.</p>
            </div>
        </div>
    </div>
</section>
<div id="footer"></div>
<script src="assets/js/jquery-1.11.0.min.js"></script>
<script src="assets/js/jquery-migrate-1.2.1.min.js"></script>
<script src="assets/js/templatemo.js"></script>
<script src="js/common.js"></script>
<script>
    let reviewPage = 0;
    let qnaPage = 0;

    const productId = new URLSearchParams(window.location.search).get('productId');
    document.addEventListener('DOMContentLoaded', async () => {
        if (!await getProduct()) return;
        loadReviews();
        checkQnaLogin();
        loadQna();

        document.querySelector('#review-more').addEventListener('click', async (e) => {
            const btn = e.currentTarget;
            if (!btn) return;
            btn.disabled = true;

            try {
                await loadReviews(reviewPage + 1);
            } finally {
                btn.disabled = false;
            }
        });

        document.querySelector('#qna-more').addEventListener('click', async (e) => {
            const btn = e.currentTarget;
            if (!btn) return;

            btn.disabled = true;

            try {
                await loadQna(qnaPage + 1);
            } finally {
                btn.disabled = false;
            }
        })
    });

    async function getProduct() {
        const response = await fetch(`/api/products/${productId}`);

        if (response.ok) {
            const data = await response.json();

            const name = data.productName;
            const price = data.productPrice;
            const unit = data.unit;
            const image = data.productImageUrl;
            const stock = data.productStock;
            const status = data.productStatus;
            const storage = data.storageMethod;
            const description = data.description;

            document.getElementById('product-detail').src = image || '';
            document.getElementById('product-detail').alt = name;
            document.getElementById('product-name').innerText = name;
            document.getElementById('product-price').innerText = unit + '당 \t' + price + '원';
            document.getElementById('product-origin').innerText = data.origin;
            document.getElementById('product-storage').innerText = storage ? storage : '-';
            document.getElementById('product-description').innerText = description ? description : '-';

            if (status === 'STOPPED') {
                document.getElementById('product-stock').innerHTML = '<p class="mt-3 fs-5 fw-bold text-danger">판매중지</p>';
                document.getElementById('product-stock').classList.add('text-danger');
            } else {
                document.getElementById('product-stock').innerHTML = renderStock(stock);
            }

            document.getElementById('quantity').disabled = stock === 0 || status === 'STOPPED';
            document.getElementById('btn-add-to-cart').disabled = stock === 0 || status === 'STOPPED';

            document.getElementById('quantity').addEventListener('input', function () {
                const value = parseInt(this.value);

                if (value > stock)
                    this.value = stock;
            });

            document.getElementById('btn-add-to-cart').addEventListener('click', () => {
                const quantity = document.getElementById('quantity').value;

                if (!parseInt(quantity) || parseInt(quantity) < 1) {
                    alert('수량은 1개 이상 입력 가능합니다.');
                    return;
                }

                addToCart(productId, name, price, unit, image, quantity, stock)
            });
            return true;
        } else {
            const error = await response.json().catch(() => ({}));
            alert(error.message || '상품 정보 불러오기 실패');
            location.href = 'shop.html';
            return false;
        }
    }

    //장바구니 추가 : btn-add-to-cart
    function addToCart(productId, productName, productPrice, unit, imageUrl, quantity, stock) {

        //기존 장바구니 가져오기
        const cart = JSON.parse(sessionStorage.getItem('cart')) || [];

        const existingCart = cart.find(item => item.productId === productId);

        const existQuantity = existingCart?.quantity || 0;
        if (existQuantity + parseInt(quantity) > stock) {
            alert('재고보다 많이 담을 수 없습니다. 최대 ' + stock + '개 까지 담을 수 있습니다.');
            return;
        }

        if (existingCart) {
            existingCart.quantity += parseInt(quantity); //이미 담겨있으면 수량만 증가
        } else
            cart.push({
                productId,
                productName,
                productPrice,
                unit,
                imageUrl,
                quantity: parseInt(quantity),
            });

        //장바구니 저장
        sessionStorage.setItem('cart', JSON.stringify(cart));
        updateCartCount()
        alert('장바구니에 추가되었습니다.')
    }

    async function loadReviews(page = 0) {
        const response = await fetch(`/api/products/${productId}/reviews?page=${page}`);

        if (response.ok) {
            reviewPage = page;

            const data = await response.json();
            const container = document.getElementById('review-list');

            if (page === 0)
                container.innerHTML = '';

            document.getElementById('review-more').classList.toggle('d-none', !data.hasNext);

            if (data.totalCount > 0) {
                document.getElementById('review-empty').classList.add('d-none');
                document.getElementById('review-count').textContent = data.totalCount;

                data.content.forEach(i => {
                    const rating = i.rating;
                    const stars = '★'.repeat(rating) + '☆'.repeat(5 - rating);
                    const images = !i.reviewImages?.length ? '' :
                        `<div class="d-flex gap-2 flex-wrap"> ${i.reviewImages.map(image =>
                            `<img src="${escapeHtml(image.imagePath)}" width="96" height="96" class="rounded object-fit-cover" alt="리뷰 사진">`
                        ).join('')} </div>`;

                    const card = `
                        <div class="border-bottom py-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <span class="text-warning">${stars}</span>
                                    <small class="text-muted ms-2">${escapeHtml(i.customerId)}</small>
                                </div>
                                <small class="text-muted">${i.createdAt.split('T')[0]}</small>
                            </div>
                            <p class="mt-2 mb-2" style="white-space: pre-wrap;">${escapeHtml(i.content)}</p>
                                ${images}

                        </div>
                    `;
                    container.innerHTML += card;
                });
            } else {
                document.getElementById('review-empty').classList.remove('d-none');
                document.getElementById('review-count').textContent = 0;
            }

        } else {
            const error = await response.json().catch(() => ({}));
            alert(error.message || '리뷰 목록 조회 실패');

        }
    }

    async function loadQna(page = 0) {
        const response = await fetch(`/api/products/${productId}/qna?page=${page}`);

        if (response.ok) {
            qnaPage = page;
            const data = await response.json();
            const container = document.getElementById('qna-list');

            if (page === 0)
                container.innerHTML = '';

            document.getElementById('qna-more').classList.toggle('d-none', !data.hasNext);

            if (data.totalCount > 0) {
                document.getElementById('qna-empty').classList.add('d-none');
                document.getElementById('qna-count').textContent = data.totalCount;

                data.content.forEach(i => {
                    const locked = i.secret && !i.content;
                    const card = `
                        <div class="accordion-item">
                            <h2 class="accordion-header">
                                <button class="accordion-button collapsed" type="button" ${locked ? 'disabled' : `data-bs-toggle="collapse" data-bs-target="#qna-${i.qnaId}"`}  >
                                    <div class="flex-grow-1">
                                        <div class="fw-bold">${escapeHtml(i.title)} ${i.secret ? '🔒' : ''}</div>
                                        <small>${escapeHtml(i.customerId)} · ${i.createdAt.split('T')[0]}</small>
                                    </div>
                                    <span class="badge ${i.status === 'WAITING' ? 'bg-secondary' : 'bg-success'} me-2">${i.statusLabel}</span>
                                </button>
                            </h2>
                            ${locked ? '' : `
                            <div id="qna-${i.qnaId}" class="accordion-collapse collapse">
                                <div class="accordion-body">
                                    <div class="mb-3">
                                        <p class="fw-bold mb-1">문의 내용</p>
                                        <p class="mb-0" style="white-space: pre-wrap;">${escapeHtml(i.content)}</p>
                                    </div>
                                    <div class="border-top pt-3">
                                        <p class="fw-bold mb-1">답변</p>
                                        <p class="mb-0" style="white-space: pre-wrap;">${i.adminAnswer ? escapeHtml(i.adminAnswer) : '아직 답변이 등록되지 않았습니다.'}</p>
                                    </div>
                                </div>
                            </div>`}
                        </div>
                    `;
                    container.innerHTML += card;
                });
            } else {
                document.getElementById('qna-empty').classList.remove('d-none');
                document.getElementById('qna-count').textContent = 0;
            }

        } else {
            const error = await response.json().catch(() => ({}));
            alert(error.message || 'QnA 목록 조회 실패');

        }
    }

    async function createQna() {
        const title = document.getElementById('qna-title').value.trim();
        const content = document.getElementById('qna-content').value.trim();
        const secret = document.getElementById('qna-secret').checked;

        if (!title) {
            alert('문의 제목을 입력해주세요.');
            return;
        }

        if (!content) {
            alert('문의 내용을 입력해주세요.');
            return;
        }

        const response = await fetchWithAuth(`/api/customers/qna`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                productId: Number(productId),
                title: title,
                content: content,
                secret: secret
            }),
        });
        if (!response) return;

        if (response.ok) {
            document.getElementById('qna-title').value = '';
            document.getElementById('qna-content').value = '';
            document.getElementById('qna-secret').checked = false;
            bootstrap.Collapse.getOrCreateInstance(document.getElementById('qna-form')).hide();
            loadQna();
        } else {
            const error = await response.json().catch(() => ({}));
            alert(error.message || 'QnA 등록 실패');
        }
    }

    async function checkQnaLogin() {
        const response = await fetch('/api/customers/my');
        if (!response.ok) {
            document.getElementById('qna-write-btn').disabled = true;
            document.getElementById('qna-login-notice').classList.remove('d-none');
            document.getElementById('qna-login-link').href = `login.html?redirect=${encodeURIComponent(location.href)}`;
        }
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
