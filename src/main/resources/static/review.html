<!DOCTYPE html>
<html lang="ko">
<head>
    <title>MFV - 리뷰 작성</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/templatemo.css">
    <link rel="icon" href="assets/img/favicon.ico">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;200;300;400;500;700;900&display=swap">
    <link rel="stylesheet" href="assets/css/fontawesome.min.css">
</head>
<body>
<div id="header"></div>
<section class="py-5 bg-light">
    <div class="col-12 col-md-6 mx-auto">
        <h3 class="mb-4">리뷰 작성</h3>
        <div class="bg-white rounded p-4 mb-3 shadow-sm">
            <h5>상품 정보</h5>
            <div class="d-flex align-items-center gap-3">
                <div id="product-img"></div>
                <div>
                    <p class="fw-bold mb-0" id="product-name"></p>
                    <p class="text-muted small mb-0" id="product-sub"></p>
                </div>
            </div>
        </div>
        <div class="bg-white rounded p-4 mb-3 shadow-sm">
            <h5>별점</h5>
            <div class="d-flex gap-2 mb-1" id="stars">
                <span class="star fs-2" data-value="1" style="cursor:pointer; color:#dee2e6;">★</span>
                <span class="star fs-2" data-value="2" style="cursor:pointer; color:#dee2e6;">★</span>
                <span class="star fs-2" data-value="3" style="cursor:pointer; color:#dee2e6;">★</span>
                <span class="star fs-2" data-value="4" style="cursor:pointer; color:#dee2e6;">★</span>
                <span class="star fs-2" data-value="5" style="cursor:pointer; color:#dee2e6;">★</span>
            </div>
            <small class="text-muted" id="rating-label">별점을 선택해주세요</small>
        </div>

        <div class="bg-white rounded p-4 mb-3 shadow-sm">
            <h5>리뷰 내용</h5>
            <textarea class="form-control" id="content" rows="5" maxlength="500"
                    placeholder="상품에 대한 솔직한 리뷰를 작성해주세요. (최소 10자)"></textarea>
            <div class="text-end mt-1">
                <small class="text-muted"><span id="content-cnt">0</span> / 500</small>
            </div>
        </div>

        <div class="bg-white rounded p-4 mb-3 shadow-sm">
            <h5>사진 첨부 <small class="text-muted fw-normal">(선택)</small></h5>
            <input type="file" class="form-control" id="reviewImage" accept="image/*">
        </div>

        <div class="d-flex justify-content-end gap-2">
            <button class="btn btn-outline-secondary" onclick="history.back()">취소</button>
            <button class="btn btn-success" onclick="submitReview()">등록</button>
        </div>
    </div>
</section>
<div id="footer"></div>

<script src="assets/js/jquery-1.11.0.min.js"></script>
<script src="assets/js/jquery-migrate-1.2.1.min.js"></script>
<script src="assets/js/templatemo.js"></script>
<script src="js/common.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let selectedRating = 0;
    const ratingLabels = ['', '별로예요', '그저 그래요', '보통이에요', '좋아요', '최고예요'];

    document.addEventListener("DOMContentLoaded", async () => {
        if (!await checkLogin()) return;

        const params = new URLSearchParams(location.search);
        const type = params.get("type"); //update or write
        const reviewId = params.get("reviewId");

        getProduct();

        if (type === 'update') {
            document.querySelector('button.btn-success').textContent = '수정';
            const response = await fetchWithAuth(`/api/customers/reviews/${reviewId}`)
            let data = await response.json();
            document.getElementById('content').value = data.content;
            document.getElementById('content-cnt').textContent = data.content.length;

            selectedRating = data.rating;
            document.querySelectorAll(".star").forEach(star => {
                star.style.color = parseInt(star.dataset.value) <= selectedRating ? '#f0a500' : '#dee2e6';
            });

            document.getElementById('rating-label').textContent = selectedRating + '점 · ' + ratingLabels[selectedRating];

        }

        document.querySelectorAll('.star').forEach(star => {
            star.addEventListener('click', () => {
                selectedRating = parseInt(star.dataset.value);
                document.querySelectorAll('.star').forEach(s => {
                    s.style.color = parseInt(s.dataset.value) <= selectedRating ? '#f0a500' : '#dee2e6';
                });
            });
        });

        document.getElementById('rating-label').textContent = selectedRating + '점 · ' + ratingLabels[selectedRating];

        //리뷰 내용 글자 수
        document.getElementById('content').addEventListener('input', e => {
            document.getElementById('content-cnt').textContent = e.target.value.length;
        })

    });

    async function getProduct() {
        const reviewProduct = JSON.parse(sessionStorage.getItem('reviewTarget'));

        document.getElementById('product-img').innerHTML = `
        <div class="d-flex align-items-center gap-3">
            ${reviewProduct.imageUrl ? `<img src="${reviewProduct.imageUrl}" style="width:56px; height:56px; object-fit:cover; border-radius:8px;">`
            : `<div style="width:56px; height:56px; background:#f0f0f0; border-radius:8px;"></div>`}
            <p class="fw-bold mb-0">${reviewProduct.productName}</p>
        </div>
        `;
    }

    async function submitReview() {
        /*
        * 리뷰 저장 -> 이미지 있으면 등록, 성공 시 주문 목록 페이지 / 없으면 리뷰 바로 등록
       */
        if (!validate()) return;

        const params = new URLSearchParams(location.search);
        const type = params.get('type');
        const orderDetailId = params.get('orderDetailId');
        const reviewId = params.get('reviewId');

        const url = type === 'update' ? `/api/customers/reviews/${reviewId}` : `/api/customers/reviews`;
        const method = type === 'update' ? 'PUT' : 'POST';

        const response = await fetchWithAuth(url, {
            method: method,
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                orderDetailId: orderDetailId,
                rating: selectedRating,
                content: document.getElementById('content').value
            })
        });

        if (!response) return;

        if (response.ok) {
            const data = await response.json();
            const imagePath = document.getElementById('reviewImage').files[0];

            if (imagePath) {
                const success = await uploadReviewImage(data.reviewId, imagePath);
                if (!success) {
                    await fetchWithAuth(`/api/customers/reviews/${data.reviewId}`, {
                        method: 'DELETE'
                    });
                    alert('이미지 업로드 실패. 다시 시도해주세요.');
                    return;
                }
            }

            location.href = 'orders.html';
        } else {
            const error = await response.json();
            alert(error.message || '리뷰 등록 실패');
        }
    }

    async function uploadReviewImage(reviewId, file) {
        const formData = new FormData();
        formData.append('file', file);

        const response = await fetchWithAuth(`/api/customers/reviews/${reviewId}/images`, {
            method: 'POST',
            body: formData
        });

        return response.ok
    }

    function validate() {
        if (selectedRating == 0) {
            alert('별점을 선택해주세요.');
            return false;
        }

        const reviewContent = document.getElementById('content').value;
        if (reviewContent === null || reviewContent === '') {
            alert('리뷰 내용을 최소 10글자 작성해주세요.');
            return false;
        }

        if (reviewContent.length < 10) {
            alert('리뷰는 최소 10글자 작성해야 합니다.');
            return false;
        }
        return true;
    }

    //todo: 리뷰 이미지 수정 구현
</script>
</body>
</html>
