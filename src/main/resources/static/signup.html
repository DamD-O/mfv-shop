<!DOCTYPE html>
<html lang="ko">
<head>
    <title>MFV- 회원가입</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/templatemo.css">
    <link rel="stylesheet" href="assets/css/custom.css">
    <link rel="icon" href="assets/img/favicon.ico">

    <!-- Load fonts style after rendering the layout styles -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;200;300;400;500;700;900&display=swap">
    <link rel="stylesheet" href="assets/css/fontawesome.min.css">
</head>
<body>
<div id="header"></div>

<!-- Start Signup Section -->
<section class="container my-5">
    <div class="container border border-dark rounded p-4">
        <h2 class="text-center text-success mb-4">회원가입</h2>
        <div id="signupError" class="alert alert-danger d-none"></div>
        <fieldset>
            <div class="row align-items-center mb-3">
                <div class="col-md-2">
                    <label for="customerId" class="form-label">아이디</label>
                </div>
                <div class="col-md-10">
                    <input type="text" class="form-control" id="customerId" placeholder="아이디를 입력하세요.">
                </div>
            </div>

            <div class="row align-items-center mb-3">
                <div class="col-md-2">
                    <label for="password" class="form-label">비밀번호</label>
                </div>
                <div class="col-md-10">
                    <input type="password" id="password" class="form-control" placeholder="비밀번호를 입력하세요.">
                </div>
            </div>

            <div class="row align-items-center mb-3">
                <div class="col-md-2">
                    <label for="passwordConfirm" class="form-label">비밀번호 확인</label>
                </div>
                <div class="col-md-10">
                    <input type="password" id="passwordConfirm" class="form-control" placeholder="비밀번호를 다시 입력하세요.">
                </div>
            </div>

            <div class="row align-items-center mb-3">
                <div class="col-md-2">
                    <label for="name" class="form-label">이름</label>
                </div>
                <div class="col-md-10">
                    <input type="text" id="name" class="form-control" placeholder="이름을 입력하세요.">
                </div>
            </div>

            <div class="row align-items-center mb-3">
                <div class="col-md-2">
                    <label for="phone" class="form-label">핸드폰 번호</label>
                </div>
                <div class="col-md-10">
                    <input type="tel" class="form-control" id="phone" placeholder="핸드폰 번호를 입력하세요. ex)010-1234-5678">
                </div>
            </div>

            <div class="row align-items-center mb-3">
                <div class="col-md-2">
                    <label for="email" class="form-label">이메일</label>
                </div>
                <div class="col-md-10">
                    <input type="email" class="form-control" id="email" placeholder="이메일을 입력하세요.">
                </div>
            </div>

            <div class="row align-items-center mb-3">
                <div class="col-md-2">
                    <label for="birthDate" class="form-label">생년월일</label>
                </div>
                <div class="col-md-10">
                    <input type="date" class="form-control" id="birthDate">
                </div>
            </div>
        </fieldset>
        <div class="d-grid mb-3">
            <button type="button" class="btn btn-success" onclick="signup()">회원가입</button>
        </div>
    </div>
</section>
<!-- End Signup Section -->
<div id="footer"></div>

<!-- Start Script -->
<script src="assets/js/jquery-1.11.0.min.js"></script>
<script src="assets/js/jquery-migrate-1.2.1.min.js"></script>
<script src="assets/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/templatemo.js"></script>
<script src="assets/js/custom.js"></script>
<script src="js/common.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    async function signup() {
        const customerId = document.getElementById('customerId').value;
        const password = document.getElementById('password').value;
        const passwordConfirm = document.getElementById('passwordConfirm').value;
        const name = document.getElementById('name').value;
        const phone = document.getElementById('phone').value;
        const email = document.getElementById('email').value;
        const birthDate = document.getElementById('birthDate').value;
        const errorDiv = document.getElementById('signupError');

        errorDiv.classList.add('d-none');

        if (!customerId) {
            errorDiv.textContent = '아이디를 입력하세요.';
            errorDiv.classList.remove('d-none');
            return;
        }

        const idRegex = /^[a-zA-Z][a-zA-Z0-9]{3,29}$/;
        if (!idRegex.test(customerId)) {
            errorDiv.textContent = '아이디는 영문으로 시작하는 4~30자의 영문, 숫자 조합이어야 합니다.';
            errorDiv.classList.remove('d-none');
            return;
        }

        if (!password) {
            errorDiv.textContent = '비밀번호를 입력하세요.';
            errorDiv.classList.remove('d-none');
            return;
        }

        const passwordRegex = /^(?=.*[a-zA-Z])(?=.*\d)(?=.*[!@#$%^&*]).{8,}$/;
        if (!passwordRegex.test(password)) {
            errorDiv.textContent = '비밀번호는 영문, 숫자, 특수문자(!,@,#,$,%,^,&,*) 포함 8자 이상이어야 합니다.';
            errorDiv.classList.remove('d-none');
            return;
        }

        if (!passwordConfirm) {
            errorDiv.textContent = '비밀번호 확인을 입력하세요.';
            errorDiv.classList.remove('d-none');
            return;
        }

        if (password !== passwordConfirm) {
            errorDiv.textContent = '비밀번호가 일치하지 않습니다.';
            errorDiv.classList.remove('d-none')
            return;
        }

        if (!name) {
            errorDiv.textContent = '이름을 입력하세요.';
            errorDiv.classList.remove('d-none');
            return;
        }

        if (!phone) {
            errorDiv.textContent = '핸드폰번호를 입력하세요.';
            errorDiv.classList.remove('d-none');
            return;
        }

        const phoneRegex = /^01[016789]-\d{3,4}-\d{4}$/;
        if (!phoneRegex.test(phone)) {
            errorDiv.textContent = '올바른 핸드폰 번호 형식이 아닙니다. (예: 010-1234-5678)';
            errorDiv.classList.remove('d-none');
            return;
        }

        if (!email) {
            errorDiv.textContent = '이메일을 입력하세요.';
            errorDiv.classList.remove('d-none');
            return;
        }

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
            errorDiv.textContent = '올바른 이메일 형식이 아닙니다. (예: example@email.com)';
            errorDiv.classList.remove('d-none');
            return;
        }

        if (!birthDate) {
            errorDiv.textContent = '생년월일을 입력하세요.';
            errorDiv.classList.remove('d-none');
            return;
        }

        try {
            const response = await fetch('/api/customers/signup', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({customerId, password, name, phone, email, birthDate}),
            });

            if (response.ok) {
                alert('회원가입 완료');
                window.location.href = 'index.html';
            } else {
                const error = await response.json();
                errorDiv.textContent = error.message || '회원가입 실패';
                errorDiv.classList.remove('d-none');
            }
        } catch (error) {
            return error;
        }
    }
</script>
</body>
</html>
