<!DOCTYPE html>
<html lang="ko">
<head>
    <title>MFV - 공지사항</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/templatemo.css">
    <link rel="icon" href="assets/img/favicon.ico">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;200;300;400;500;700;900&display=swap">
    <link rel="stylesheet" href="assets/css/fontawesome.min.css">
</head>
<body>
<div id="header"></div>
<section class="py-5 bg-light">
    <div class="col-12 col-md-10 mx-auto">
        <h3>공지사항</h3>
    </div>
    <div class="col-12 col-md-10 mx-auto border border-white p-4 bg-white" style="border-radius: 12px">
        <div id="notice-detail" class="d-none">
            <h5 id="notice-title" class="fw-bold text-break mb-1"></h5>
            등록일 <small id="notice-date" class="text-muted"></small>
            <hr>
            <div id="notice-content" class="text-break" style="white-space: pre-wrap; min-height: 200px;"></div>
        </div>
        <p id="notice-error" class="text-muted text-center py-5 d-none"></p>
        <div class="text-end mt-4">
            <a href="support.html" class="btn btn-outline-success">목록으로</a>
        </div>
    </div>
</section>
<div id="footer"></div>

<script src="assets/js/jquery-1.11.0.min.js"></script>
<script src="assets/js/jquery-migrate-1.2.1.min.js"></script>
<script src="assets/js/templatemo.js"></script>
<script src="js/common.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        loadNoticeContent();
    });

    async function loadNoticeContent() {
        const params = new URLSearchParams(window.location.search);
        const noticeId = params.get('noticeId');

        if (!noticeId) {
            document.getElementById('notice-error').textContent = '잘못된 접근입니다.';
            document.getElementById('notice-error').classList.remove('d-none');
            return;
        }

        const response = await fetch(`/api/notice/${noticeId}`);

        if (response.ok) {
            const data = await response.json();

            document.getElementById('notice-detail').classList.remove('d-none');
            document.getElementById('notice-title').textContent = data.title;
            document.getElementById('notice-date').textContent = data.createdAt.split('T')[0];
            document.getElementById('notice-content').textContent = data.content;
        } else {
            const error = await response.json().catch(() => ({}));
            document.getElementById('notice-error').textContent = error.message || '공지사항 상세내용 조회 실패';
            document.getElementById('notice-error').classList.remove('d-none');
        }
    }
</script>
</body>
</html>
